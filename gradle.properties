org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Supabase connection.
# Replace these with your own project's values (Supabase dashboard >
# Project Settings > API). Leaving them blank is supported: the app then runs
# against the bundled sample data so it still launches on a clean machine.
# The anon key is a public, row-level-security-gated key. Never put the
# service_role key in an Android app.
# ---------------------------------------------------------------------------
SUPABASE_URL=
SUPABASE_ANON_KEY=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
